<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Signal Stack</title>
<style>body{font:14px system-ui;margin:0;background:#f6f7f9;color:#111}header{background:#14213d;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
nav button{margin:2px;padding:6px 10px;border:0;border-radius:6px;cursor:pointer}nav button.on{background:#fca311}main{padding:16px;max-width:1100px;margin:auto}
.card{background:#fff;border-radius:8px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0002}input,textarea,select{padding:6px;margin:2px;max-width:100%}textarea{width:100%;min-height:70px}
pre{white-space:pre-wrap}.tag{font-size:11px;background:#e5e7eb;border-radius:4px;padding:1px 6px;margin-right:4px}.bad{color:#b00020}</style>
<header><b>Signal Stack</b><select id=co onchange="cid=this.value;show(tab)"></select><nav id=nav></nav></header><main id=m></main>
<script>
let cid=null,tab='setup';                                   // current company id + current tab
const $=s=>document.querySelector(s);                       // query shortcut
const api=(u,o={})=>fetch('/api'+u,{headers:{'Content-Type':'application/json'},...o,body:o.body&&(o.body instanceof FormData?o.body:JSON.stringify(o.body))}).then(r=>r.json()); // JSON fetch wrapper
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); // HTML-escape all untrusted text
const tabs=['setup','profile','interview','stack','sources','competitors','feed','brief','settings'];
$('#nav').innerHTML=tabs.map(t=>`<button id=b-${t} onclick="show('${t}')">${t}</button>`).join(''); // tab buttons
async function companies(){const l=await api('/companies');$('#co').innerHTML=l.map(c=>`<option value=${c.id}>${esc(c.name)}</option>`).join('');cid=l.length?$('#co').value:null} // fill company picker
async function show(t){tab=t;tabs.forEach(x=>$('#b-'+x).classList.toggle('on',x==t));const m=$('#m'); // render one tab
 if(t=='setup'){m.innerHTML=`<div class=card><h3>New company</h3><input id=n placeholder=Name><input id=u placeholder=https://site.com size=30><button onclick=create()>Research</button><pre id=out></pre></div>`;return}
 if(!cid){m.innerHTML='Create a company first.';return}
 if(t=='profile'){const c=await api('/companies/'+cid);                       // verified vs assumptions, editable profile, answers, context change
  m.innerHTML=`<div class=card><h3>Research</h3><b>Verified (quote found on page)</b><ul>${(c.research.facts||[]).map(f=>`<li>${esc(f.claim)} <a href="${esc(f.source_url)}" target=_blank>src</a></li>`).join('')}</ul><b>Assumptions</b><ul>${(c.research.assumptions||[]).map(f=>`<li>${esc(f.claim)} <i>(${esc(f.basis)})</i></li>`).join('')}</ul></div>
  <div class=card><h3>Intelligence profile (editable JSON)</h3><textarea id=pf style="min-height:260px">${esc(JSON.stringify(c.profile,null,2))}</textarea><button onclick="api('/companies/${cid}/profile',{method:'PUT',body:JSON.parse($('#pf').value)}).then(()=>alert('saved'))">Save</button> <button onclick="api('/companies/${cid}/profile/rebuild',{method:'POST'}).then(()=>show('profile'))">Rebuild from answers</button></div>
  <div class=card><h3>Answers</h3>${c.qa.map(q=>`<p><b>${esc(q.question)}</b><br><input value="${esc(q.answer||'')}" size=80 onchange="api('/qa/${q.id}',{method:'PUT',body:{answer:this.value}})">${q.skipped?' (skipped)':''}</p>`).join('')}</div>
  <div class=card><h3>Business context changed?</h3><textarea id=ctx placeholder="e.g. We now target Gulf-country students"></textarea><button onclick="api('/companies/${cid}/reassess',{method:'POST',body:{context:$('#ctx').value}}).then(()=>alert('Reassessing... see Brief > change_log'))">Reassess Signal Stack</button></div>`}
 if(t=='interview')return ask({});                                           // start/resume interview
 if(t=='stack'||t=='sources'){const s=await api(`/companies/${cid}/sources`),d=t=='sources'?await api(`/companies/${cid}/duplicates`):null; // stack=reasons, sources=health/history/dups
  m.innerHTML=`<div class=card><button onclick="api('/companies/${cid}/discover',{method:'POST'}).then(()=>show('${t}'))">Discover sources</button> <button onclick="api('/companies/${cid}/crawl',{method:'POST'});alert('Crawl started')">Crawl now</button> <input id=f type=file onchange="up()"> <small>internal CSV/XLSX/PDF/TXT</small></div>`
  +(d?`<div class=card><h3>Duplicates</h3>Duplicate sources: ${d.duplicate_sources.length?d.duplicate_sources.map(x=>`#${x.source} = #${x.duplicate_of}`).join(', '):'none'}<br>Records dropped as duplicates: ${d.records_dropped_as_duplicates.map(x=>`${esc(x.name)} (${x.dup_count})`).join(', ')||'none'}</div>`:'')
  +['customers','competitors','market','internal'].map(c=>`<div class=card><h3>${c} (${s.filter(x=>x.category==c).length})</h3>${s.filter(x=>x.category==c).map(x=>`<p><b>${esc(x.name)}</b> <span class=tag>${x.kind}</span><span class=tag>${x.status}</span>${t=='sources'?`<span class=tag>records ${x.records}</span><span class=tag>dups ${x.dup_count}</span><span class="tag ${x.fail_count?'bad':''}">health: ${esc(x.last_status||'unchecked')}</span> <a href=# onclick="hist(${x.id},this);return false">history</a><br><a href="${esc(x.url)}" target=_blank>${esc(x.url.slice(0,90))}</a><span id=h${x.id}></span>`:''}<br><i>Why: ${esc(x.reason)}</i><br><button onclick="st(${x.id},'approved')">Approve</button><button onclick="st(${x.id},'removed')">Remove</button></p>`).join('')}</div>`).join('')
  +(t=='sources'?`<div class=card><h3>Add source</h3><select id=ac><option>customers<option>competitors<option>market</select><select id=ak><option>rss<option>page<option>hn<option>se</select><input id=au placeholder=URL size=40><input id=ar placeholder=reason size=30><button onclick="add()">Add</button></div>`:'')}
 if(t=='competitors'){const l=await api(`/companies/${cid}/competitors`);        // competitor profile pages
  m.innerHTML=l.length?l.map(c=>{const p=c.profile;return`<div class=card><h3>${esc(c.name)} <a href="${esc(c.url)}" target=_blank>site</a> <button onclick="cp(${c.id},this)">${p?'Refresh':'Build'} profile</button></h3><i>Why tracked: ${esc(c.why)}</i>${p?`<p><b>Positioning:</b> ${esc(p.positioning)}<br><b>Offerings:</b> ${esc((p.offerings||[]).join('; '))}<br><b>Pricing evidence:</b> ${esc(p.pricing_evidence)}<br><b>Strengths:</b> ${esc((p.strengths||[]).join('; '))}<br><b>Weaknesses:</b> ${esc((p.weaknesses||[]).join('; '))}<br><b>Recent moves (evidence):</b> ${(p.recent_moves||[]).map(x=>`[rec ${x.record_id}] ${esc(x.summary)}`).join(' | ')||'none found'}<br><b>Why it matters (interpretation):</b> ${esc(p.why_it_matters)} <span class=tag>threat ${p.threat_level}/5</span><br><small>Gaps: ${esc(p.evidence_gaps)}</small></p>`:''}</div>`}).join(''):'<div class=card>None yet. Stack > Discover sources.</div>'}
 if(t=='feed'){const cs=await api(`/companies/${cid}/competitors`);             // intelligence feed with full filter bar
  m.innerHTML=`<div class=card>Category <select id=fc><option value="">all<option>customers<option>competitors<option>market<option>internal</select> Competitor <select id=fp><option value="">all${cs.map(c=>`<option value=${c.id}>${esc(c.name)}`).join('')}</select> From <input id=fd type=date> To <input id=fu type=date><br>Type <select id=ft><option value="">all<option>opportunity<option>threat<option>neutral</select> Verification <select id=fv><option value="">all<option>verified<option>unverified</select> Min relevance <input id=fr type=number min=0 max=5 value=0 style="width:50px"> Min impact <input id=fi type=number min=0 max=5 value=0 style="width:50px"> Min score <input id=fs type=number value=0 style="width:60px"> <button onclick=flt()>Apply</button></div><div id=fl></div>`;flt()}
 if(t=='brief'){const [b,a,r]=await Promise.all([api(`/companies/${cid}/briefs`),api(`/companies/${cid}/actions`),api(`/companies/${cid}/runs`)]); // briefs, actions, run log
  m.innerHTML=`<div class=card><button onclick="api('/companies/${cid}/brief',{method:'POST'});alert('Generating... refresh in a minute')">Generate Monday Brief</button> <button onclick="api('/companies/${cid}/audit',{method:'POST'});alert('Audit started')">Run source audit</button></div>
  <div class=card><h3>Runs (failures visible)</h3>${r.map(x=>`<div class="${x.status=='failed'?'bad':''}">${x.started} ${x.kind}: <b>${x.status}</b> ${x.status=='failed'?esc((x.detail||'').slice(0,160)):''}</div>`).join('')}</div>
  <div class=card><h3>Actions</h3>${a.map(x=>`<label><input type=checkbox ${x.done?'checked':''} onchange="api('/actions/${x.id}',{method:'PATCH',body:{done:this.checked}})"> ${esc(x.text)} <span class=tag>${esc(x.owner)}</span><span class=tag>${esc(x.priority)}</span></label><br>`).join('')}</div>`+b.map(x=>`<div class=card><h3>${x.kind} · ${x.created} <a href="/api/briefs/${x.id}/export">export .md</a></h3><pre>${esc(x.body)}</pre></div>`).join('')}
 if(t=='settings'){const c=await api('/companies/'+cid),s=c.settings;m.innerHTML=`<div class=card><h3>Settings</h3>`+Object.keys(s).map(k=>`<label>${k} <input id=s-${k} value="${esc(s[k])}"></label><br>`).join('')+`<button onclick='sv(${JSON.stringify(Object.keys(s))})'>Save (reschedules jobs)</button></div>`}}
async function create(){$('#out').textContent='Researching... (30-60s)';const r=await api('/companies',{method:'POST',body:{name:$('#n').value,url:$('#u').value}});$('#out').textContent=JSON.stringify(r);await companies();cid=r.id;$('#co').value=cid} // create + research
async function ask(b){const r=await api(`/companies/${cid}/interview`,{method:'POST',body:b});const n=r.next; // send answer, show next question
 $('#m').innerHTML=r.done?'<div class=card>Interview complete. Profile built — see Profile tab.</div>':`<div class=card><small>Question ${n.idx}/10 · ${esc(n.area)}</small><h3>${esc(n.question)}</h3><textarea id=ans></textarea><button onclick="ask({id:${n.id},answer:$('#ans').value})">Next</button> <button onclick="ask({id:${n.id},skip:1})">Skip (confidential)</button></div>`}
const st=(id,status)=>api('/sources/'+id,{method:'PATCH',body:{status}}).then(()=>show(tab));   // approve/remove source
const add=()=>api(`/companies/${cid}/sources`,{method:'POST',body:{category:$('#ac').value,kind:$('#ak').value,url:$('#au').value,reason:$('#ar').value}}).then(()=>show('sources')); // manual add
const up=()=>{const fd=new FormData();fd.append('file',$('#f').files[0]);fetch(`/api/companies/${cid}/upload`,{method:'POST',body:fd}).then(r=>r.json()).then(r=>alert(JSON.stringify(r))).then(()=>show(tab))}; // internal upload
const sv=ks=>{const o={};ks.forEach(k=>{const v=$('#s-'+k).value;o[k]=isNaN(v)?v:+v});api(`/companies/${cid}/settings`,{method:'PUT',body:o}).then(()=>alert('saved'))}; // save settings
async function hist(id,el){const h=await api(`/sources/${id}/history`);$('#h'+id).innerHTML='<br><small>'+(h.map(x=>`${x.ts} ${x.ok?'ok':'<span class=bad>FAIL</span>'} +${x.new_records} new, ${x.dups} dup ${x.ok?'':esc(x.detail)}`).join('<br>')||'no checks yet')+'</small>'} // per-source crawl history
async function cp(id,btn){btn.disabled=true;btn.textContent='Working...';const r=await api(`/companies/${cid}/competitors/${id}/profile`,{method:'POST'});if(r.error)alert(r.error);show('competitors')} // build competitor profile
const flt=async()=>{const p=new URLSearchParams({category:$('#fc').value,competitor:$('#fp').value,since:$('#fd').value,until:$('#fu').value,type:$('#ft').value,verified:$('#fv').value,min_relevance:$('#fr').value,min_impact:$('#fi').value,min_score:$('#fs').value});[...p.keys()].forEach(k=>{if(!p.get(k)||p.get(k)=='0')p.delete(k)});renderFeed(await api(`/companies/${cid}/feed?`+p))}; // apply all filters
const renderFeed=f=>$('#fl').innerHTML=f.map(r=>{const a=r.analysis||{};return`<div class=card><b>${esc(r.title)}</b> <span class=tag>#${r.id}</span><span class=tag>${r.category}</span><span class=tag>score ${r.score??'–'}</span><span class=tag>${a.type||'unanalysed'}</span><span class=tag>${a.verified||''}</span><br><small>${esc(r.sname)} · published ${esc(r.published)} · found ${r.discovered}</small><br><a href="${esc(r.url)}" target=_blank>${esc(r.url.slice(0,100))}</a><p><i>Evidence:</i> ${esc(r.snippet)}</p>${a.why_matters?`<p><i>Interpretation:</i> ${esc(a.interpretation)}<br><i>Why it matters:</i> ${esc(a.why_matters)}<br><i>Action:</i> ${esc(a.action)}<br><small>${esc(a.why_ranked)} · evidence strength ${a.evidence_strength}</small></p>`:''}</div>`}).join('')||'No records.'; // render feed cards
companies().then(()=>show('setup'));
